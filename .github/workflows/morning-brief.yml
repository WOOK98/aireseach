name: "Morning Brief"

on:
  schedule:
    # 3:45 AM ET (pre-market). Covers both EST and EDT:
    #   EST (Nov-Mar): 3:45 AM ET = 8:45 UTC
    #   EDT (Mar-Nov): 3:45 AM ET = 7:45 UTC
    # We use 8:15 UTC as a compromise; the script checks NYSE local time.
    - cron: "15 8 * * 1-5"  # Mon-Fri, 8:15 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Force run (skip trading-day check)"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: morning-brief-${{ github.ref }}
  cancel-in-progress: false

jobs:
  brief:
    name: "📰 Generate Morning Brief"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      issues: write

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🔑 Validate secrets
        run: |
          MISSING=""
          if [ -z "${LLM_API_KEY:-}" ] && [ -z "${DEEPSEEK_KEY:-}" ]; then
            MISSING="LLM_API_KEY or DEEPSEEK_API_KEY"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets: $MISSING"
            echo "Set these in GitHub repo Settings → Secrets → Actions"
            exit 1
          fi
        env:
          LLM_API_KEY: *** secrets.MORNING_BRIEF_LLM_KEY }}
          DEEPSEEK_KEY: *** secrets.DEEPSEEK_API_KEY }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 📰 Generate morning brief
        id: generate
        env:
          LLM_API_KEY: *** secrets.MORNING_BRIEF_LLM_KEY || secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
          JINA_API_KEY: *** secrets.JINA_API_KEY }}
          AIRESEARCH_WATCHLIST: ${{ secrets.AIRESEARCH_WATCHLIST }}
          WATCHLIST_TICKERS: ${{ secrets.WATCHLIST_TICKERS }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          set +e
          python scripts/morning-brief/generate.py $FORCE_FLAG
          EXIT_CODE=$?
          set -e

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Check if a brief was generated or skipped
          TODAY=$(TZ="America/New_York" date +%Y-%m-%d)
          if [ -f "briefs/${TODAY}.md" ]; then
            echo "status=generated" >> "$GITHUB_OUTPUT"
            echo "date=${TODAY}" >> "$GITHUB_OUTPUT"
          elif [ -f "briefs/${TODAY}.skip" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "date=${TODAY}" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "date=${TODAY}" >> "$GITHUB_OUTPUT"
          fi

          exit $EXIT_CODE

      - name: 💾 Commit brief
        if: steps.generate.outputs.status == 'generated'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add briefs/
          DATE="${{ steps.generate.outputs.date }}"
          git commit -m "brief: morning brief ${DATE} [skip ci]" || echo "Nothing to commit"
          git push

      - name: 📝 Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = '${{ steps.generate.outputs.date }}' || new Date().toISOString().slice(0, 10);
            const title = `🚨 Morning Brief failed — ${today}`;

            // Duplicate guard: check if today's issue already exists
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'morning-brief',
              per_page: 50,
            });

            const duplicate = existing.find(i => i.title === title);
            if (duplicate) {
              console.log(`Issue #${duplicate.number} already exists for today, appending run URL`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `Another failure: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: [
                  `## Morning Brief Generation Failed`,
                  ``,
                  `- **Date:** ${today}`,
                  `- **Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  `- **Trigger:** ${context.eventName}`,
                  ``,
                  `### Next steps`,
                  `1. Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) logs`,
                  `2. Common causes: LLM API down, watchlist missing, rate limit`,
                  `3. Fix and re-run manually via workflow_dispatch`,
                ].join('\n'),
                labels: ['bug', 'morning-brief'],
              });
            }
